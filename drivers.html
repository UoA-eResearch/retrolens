<html>

<head>
  <title>NZCCD drivers of coastal change</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.glify@3.3.0/dist/glify-browser.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/spin.js/2.3.2/spin.min.js"></script>
  <script src="https://unpkg.com/leaflet-spin@1.1.0/leaflet.spin.min.js"></script>
  <script src="https://unpkg.com/leaflet-geosearch@latest/dist/bundle.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@latest/assets/css/leaflet.css">
  <script src="https://unpkg.com/leaflet-providers@1.3.0/leaflet-providers.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"
    integrity="sha512-zInFF17qBFVvvvFpIfeBzo7Tj7+rQxLeTJDmbxjBz5/zIr89YVbTNelNhdTT+/DCrxoVzBeUPVFJsczKbB7sew=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
      body, html, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
      .legend {
          color: white; padding: 10px; background-color: rgba(0, 0, 0, 0.8);
          border-radius: 5px; max-width: 360px; font: 12px system-ui, sans-serif;
      }
      .legend i { width: 18px; height: 12px; float: left; margin-right: 8px; clear: left; }
      .legend h4 { margin: 0 0 6px 0; }
      .picker {
          padding: 8px; background: rgba(0, 0, 0, 0.8); color: white;
          border-radius: 5px; font: 13px system-ui, sans-serif;
      }
      .picker select { width: 230px; }
  </style>
</head>

<body>
  <div id="map"></div>
  <script type="module">
    var map = L.map('map', { center: [-41, 173], zoom: 6 })

    var baseMaps = {
      "CartoDB Positron": L.tileLayer.provider('CartoDB.Positron').addTo(map),
      "OSM": L.tileLayer.provider("OpenStreetMap.Mapnik"),
      "CartoDB Dark Matter": L.tileLayer.provider("CartoDB.DarkMatter"),
      "ESRI WorldImagery": L.tileLayer.provider("Esri.WorldImagery"),
    }
    L.control.layers(baseMaps, {}, { position: "topleft" }).addTo(map);

    // variable definitions: diverging for signed, sequential for magnitude
    const DIVERGING = ['#e34948', '#f0efec', '#2a78d6']  // erosion .. accretion
    const SEQUENTIAL = ['#cde2fb', '#6da7ec', '#2a78d6', '#184f95', '#0d366b']
    const VARS = {
      WLR:              { label: "Shoreline change WLR (m/yr)", type: "div", domain: [-1.5, 1.5] },
      EPR:              { label: "End-point rate (m/yr)", type: "div", domain: [-1.5, 1.5] },
      NSM:              { label: "Net shoreline movement (m)", type: "div", domain: [-100, 100] },
      SCE:              { label: "Shoreline change envelope (m)", type: "seq", domain: [0, 150] },
      hs_mean:          { label: "Mean Hs (m)", type: "seq", domain: [0, 3.5] },
      hs_p99:           { label: "Hs 99th percentile (m)", type: "seq", domain: [0, 8] },
      storm_hrs_gt4m_yr:{ label: "Storm hours >4m (h/yr)", type: "seq", domain: [0, 2500] },
      cge_mean:         { label: "Wave energy flux (kW/m)", type: "seq", domain: [0, 60] },
      wave_incidence_deg:{ label: "Wave incidence (°)", type: "seq", domain: [0, 120] },
      beach_slope_face: { label: "Beach-face slope (tanβ)", type: "seq", domain: [0.01, 0.15] },
      tanbeta_nearshore:{ label: "Nearshore slope (tanβ)", type: "seq", domain: [0, 0.06] },
      vlm_mm_yr:        { label: "Vertical land motion (mm/yr, +up)", type: "div", domain: [-4, 4] },
      backshore_mean:   { label: "Backshore mean elevation (m)", type: "seq", domain: [0, 40] },
      backshore_max:    { label: "Backshore max elevation (m)", type: "seq", domain: [0, 80] },
      spring_range_m:   { label: "Spring tidal range (m)", type: "seq", domain: [0.5, 4] },
      dist_mouth_km:    { label: "Distance to river mouth (km)", type: "seq", domain: [0, 30] },
      river_supply_idx: { label: "River sediment supply index", type: "seq", domain: [0, 50] },
      rain_mm_yr:       { label: "Rainfall (mm/yr)", type: "seq", domain: [500, 4000] },
      shaking_idx:      { label: "Seismic shaking index", type: "seq", domain: [5, 10] },
      erodibility_ord:  { label: "Lithologic erodibility (1 hard - 5 sand)", type: "seq", domain: [1, 5] },
      geol_age_ma:      { label: "Rock age (Ma)", type: "seq", domain: [0, 300] },
    }

    map.spin(true);
    const parquet = await import("https://unpkg.com/@dsnp/parquetjs@1.7.0/dist/browser/parquet.esm.js");
    const buffer_library = await import("https://esm.sh/buffer");
    const URL = "driver_data/drivers_map.parquet";
    let resp = await fetch(URL)
    let buffer = await resp.arrayBuffer()
    buffer = buffer_library.Buffer.from(buffer);
    const reader = await parquet.ParquetReader.openBuffer(buffer);
    let cursor = reader.getCursor();
    let record = null;
    var results = []
    while (record = await cursor.next()) { results.push(record) }
    await reader.close();
    console.log(`read ${results.length} rows from ${URL}`)

    var points = results.map(r => [parseFloat(r.lat), parseFloat(r.lon)])
    var layer = null;
    var currentVar = "WLR";

    function draw(varname) {
      currentVar = varname;
      const v = VARS[varname];
      const colors = v.type === "div" ? DIVERGING : SEQUENTIAL;
      const cmap = chroma.scale(colors).domain(
        v.type === "div" ? [v.domain[0], 0, v.domain[1]] : v.domain);
      if (layer) layer.remove();
      layer = L.glify.points({
        map: map,
        data: points,
        size: 10,
        fragmentShaderSource: L.glify.shader.fragment.simpleCircle,
        sensitivity: 5,
        color: function (index, point) {
          var val = parseFloat(results[index][varname])
          if (!isFinite(val)) return { r: 0.35, g: 0.35, b: 0.35 };
          var c = cmap(val).gl()
          return { r: c[0], g: c[1], b: c[2] };
        },
        click: function (e, point, xy) {
          var i = points.indexOf(point);
          var r = results[i];
          var rows = Object.keys(VARS).map(k => {
            var val = parseFloat(r[k]);
            return `${VARS[k].label}: <b>${isFinite(val) ? val.toPrecision(4) : "–"}</b>`
          }).join("<br>")
          if (window.popup) map.closePopup(window.popup)
          window.popup = L.popup({ minWidth: 340, maxHeight: 420 })
            .setContent(`<b>${r.Region}</b> — UniqueID ${r.UniqueID}<br>
              Typology: ${r.Typology} | Shore: ${r.SHORE_TYPE} | Exposure: ${r.EXPOSURE}<br>
              Lithology: ${r.lith_class}<br><hr>${rows}`)
            .setLatLng(point).addTo(map);
        },
      });
      updateLegend(v, cmap);
    }

    // variable picker
    var picker = L.control({ position: 'topright' });
    picker.onAdd = function () {
      var div = L.DomUtil.create('div', 'picker');
      var opts = Object.keys(VARS).map(k =>
        `<option value="${k}">${VARS[k].label}</option>`).join("")
      div.innerHTML = `<b>Colour by</b><br><select id="varsel">${opts}</select>`
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    picker.addTo(map);
    document.getElementById("varsel").addEventListener("change",
      e => draw(e.target.value));

    // legend
    var legend = L.control({ position: 'bottomright' });
    var legendDiv = null;
    legend.onAdd = function () {
      legendDiv = L.DomUtil.create('div', 'legend');
      return legendDiv;
    };
    legend.addTo(map);
    function updateLegend(v, cmap) {
      var html = `<h4>${v.label}</h4>`
      var steps = 7
      for (var i = 0; i < steps; i++) {
        var val = v.domain[0] + (v.domain[v.domain.length - 1] - v.domain[0]) * i / (steps - 1)
        var prefix = i == 0 ? "≤ " : (i == steps - 1 ? "≥ " : "")
        html += `<i style="background:${cmap(val).css()}"></i>${prefix}${val.toPrecision(3)}<br>`
      }
      html += `<i style="background:#595959"></i>no data<br>`
      if (currentVar === "WLR" || currentVar === "EPR" || currentVar === "NSM")
        html += `Red = erosion, blue = accretion.<br>`
      html += `NZCCD rates and candidate drivers of coastal change. Pick a variable, click a point for all values. See <a href="http://coastalchange.nz" target="_blank" rel="noopener noreferrer">coastalchange.nz</a>`
      legendDiv.innerHTML = html
    }

    draw("WLR");
    map.spin(false);

    new GeoSearch.GeoSearchControl({
      provider: new GeoSearch.OpenStreetMapProvider(),
      style: 'button', autoComplete: true, autoCompleteDelay: 250,
      autoClose: true, position: "topleft"
    }).addTo(map);
  </script>
</body>

</html>
